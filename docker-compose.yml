services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roadmap}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roadmap123}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: roadmap:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-roadmap}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-roadmap123}
    ports:
      - "${ROADMAP_PORT:-8010}:8010"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  tileserver:
    build:
      context: .
      dockerfile: Dockerfile.tileserver
    image: roadmap-tileserver:local
    volumes:
      - ./data:/app/data:ro
    ports:
      - "${TILESERVER_PORT:-8890}:8890"
    restart: unless-stopped

volumes:
  postgres-data:
